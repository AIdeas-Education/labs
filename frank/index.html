<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Altitude Laboratory</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2430;--muted:#5b6573;--accent:#1f6fb2;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1e242b;--ink:#e6e9ed;--muted:#9aa4b0;--accent:#5aa7e6;--bad:#f2867d}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px system-ui,"Segoe UI",sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{background:var(--card);padding:28px;border-radius:12px;max-width:380px;width:100%;box-shadow:0 2px 12px #0002}
h1{font-size:21px;margin:0 0 6px}p{color:var(--muted);margin:0 0 18px;font-size:15px}
input{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid var(--muted);border-radius:8px;background:transparent;color:var(--ink)}
button{margin-top:12px;width:100%;font:inherit;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.3em;margin-top:10px;font-size:14px;color:var(--bad)}
#grp{font-weight:600;color:var(--accent)}
small{display:block;margin-top:16px;color:var(--muted);font-size:12px}
</style></head><body><main>
<form id="f" autocomplete="off">
  <h1>Altitude Laboratory</h1>
  <p>Enter the password you received to open the lab. <span id="grp"></span></p>
  <input id="pw" type="password" aria-label="Password" placeholder="Password" required autofocus>
  <button id="go" type="submit">Open lab</button>
  <div id="msg" role="status"></div>
  <small>Protected copy. &copy; All rights reserved by the lab's authors.</small>
</form></main>
<script id="cfg" type="application/json">{"salt": "eyt6SswClWIgC74eH7On9w==", "iter": 600000, "hours": 12, "v": "665de1862d88"}</script>
<script>
(function(){
  var C = JSON.parse(document.getElementById('cfg').textContent);
  var msg = document.getElementById('msg'), go = document.getElementById('go');
  var q = new URLSearchParams(location.search);
  if (q.get('g')) document.getElementById('grp').textContent = 'Group ' + q.get('g') + '.';
  function enter(){ location.replace('app/index.html' + location.search); }
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  if (!('serviceWorker' in navigator) || !window.isSecureContext) {
    msg.textContent = 'This browser cannot open the protected lab here. Use an up-to-date Chrome, Edge, Firefox or Safari (not a private window).';
    go.disabled = true; return;
  }
  function ask(sw, data){ return new Promise(function(ok){ var ch = new MessageChannel();
    ch.port1.onmessage = function(e){ ok(e.data); }; sw.postMessage(data, [ch.port2]); }); }
  var ready = navigator.serviceWorker.register('sw.js?v=' + C.v, {scope: './'})
    .then(function(){ return navigator.serviceWorker.ready; });
  ready.then(function(reg){ return ask(reg.active, {type: 'status'}); })
       .then(function(r){ if (r && r.ok) enter(); }).catch(function(){});
  document.getElementById('f').addEventListener('submit', async function(ev){
    ev.preventDefault(); go.disabled = true; msg.style.color = 'inherit'; msg.textContent = 'Opening…';
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveBits']);
      var raw = await crypto.subtle.deriveBits({name: 'PBKDF2', salt: b64(C.salt), iterations: C.iter, hash: 'SHA-256'}, base, 256);
      var reg = await ready;
      var r = await ask(reg.active, {type: 'unlock', raw: raw, hours: C.hours});
      if (r && r.ok) { msg.textContent = 'Loading the lab…'; enter(); return; }
      throw new Error('wrong');
    } catch (e) {
      msg.style.color = ''; msg.textContent = 'Wrong password, or the connection failed. Try again.'; go.disabled = false;
    }
  });
})();
</script></body></html>

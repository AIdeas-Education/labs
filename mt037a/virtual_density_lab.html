<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEYNAME = 'lablock:' + P.salt;
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  async function keyFrom(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, 256));
  }
  async function open(raw){
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    var htmlText = new TextDecoder().decode(plain);
    try { sessionStorage.setItem(KEYNAME, btoa(String.fromCharCode.apply(null, raw))); } catch(e) {}
    document.open(); document.write(htmlText); document.close();
  }
  var saved = null;
  try { saved = sessionStorage.getItem(KEYNAME); } catch(e) {}
  if (saved) { open(b64(saved)).catch(function(){ try{sessionStorage.removeItem(KEYNAME);}catch(e){} }); }
  document.getElementById('f').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var msg = document.getElementById('msg'); msg.textContent = 'Opening…'; msg.style.color = 'inherit';
    try { await open(await keyFrom(document.getElementById('pw').value)); }
    catch(e){ msg.style.color = ''; msg.textContent = 'Wrong password. Check the announcement in your course.'; }
  });
})();
</script></body></html>
